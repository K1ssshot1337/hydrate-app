name: Build & Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-hydratekit:
    name: Test HydrateKit
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build HydrateKit
        run: |
          cd HydrateKit
          xcodebuild build \
            -scheme HydrateKit \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -quiet

      - name: Run HydrateKit Tests
        run: |
          cd HydrateKit
          xcodebuild test \
            -scheme HydrateKit \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            | xcbeautify --renderer github-actions || \
          xcodebuild test \
            -scheme HydrateKit \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16'
